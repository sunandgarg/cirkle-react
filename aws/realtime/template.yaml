AWSTemplateFormatVersion: "2010-09-09"
Description: Cirkle production realtime delivery using AppSync Events and Supabase as durable history.

Parameters:
  SupabaseUrl:
    Type: String
    Default: https://bugwubrwvlqayxwcazfd.supabase.co
  SupabasePublishableKey:
    Type: String
    NoEcho: true
  BridgeSecret:
    Type: String
    NoEcho: true
    MinLength: 32

Resources:
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - { Key: Application, Value: Cirkle }

  RealtimeAuthorizer:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cirkle-appsync-authorizer
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 5
      MemorySize: 256
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_PUBLISHABLE_KEY: !Ref SupabasePublishableKey
      Code:
        ZipFile: |
          const headers = token => ({
            apikey: process.env.SUPABASE_PUBLISHABLE_KEY,
            authorization: `Bearer ${token.replace(/^Bearer\s+/i, "")}`,
            "content-type": "application/json"
          });
          exports.handler = async event => {
            try {
              const token = event.authorizationToken || "";
              if (!token) return { isAuthorized: false, ttlOverride: 0 };
              const context = event.requestContext || {};
              if (context.operation === "EVENT_CONNECT") {
                const response = await fetch(`${process.env.SUPABASE_URL}/auth/v1/user`, { headers: headers(token) });
                if (!response.ok) return { isAuthorized: false, ttlOverride: 0 };
                const user = await response.json();
                return { isAuthorized: Boolean(user.id), handlerContext: { userId: user.id || "" }, ttlOverride: 30 };
              }
              const response = await fetch(`${process.env.SUPABASE_URL}/rest/v1/rpc/appsync_can_access_channel`, {
                method: "POST",
                headers: headers(token),
                body: JSON.stringify({
                  p_channel: context.channel,
                  p_operation: context.operation === "EVENT_PUBLISH" ? "publish" : "subscribe"
                })
              });
              const allowed = response.ok && await response.json();
              return { isAuthorized: allowed === true, ttlOverride: allowed === true ? 120 : 0 };
            } catch (error) {
              console.error("authorization failed", error?.message || error);
              return { isAuthorized: false, ttlOverride: 0 };
            }
          };

  AppSyncAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RealtimeAuthorizer
      Principal: appsync.amazonaws.com

  EventApi:
    Type: AWS::AppSync::Api
    DependsOn: AppSyncAuthorizerPermission
    Properties:
      Name: cirkle-production-realtime
      OwnerContact: Cirkle.World
      EventConfig:
        AuthProviders:
          - AuthType: AWS_LAMBDA
            LambdaAuthorizerConfig:
              AuthorizerUri: !GetAtt RealtimeAuthorizer.Arn
              AuthorizerResultTtlInSeconds: 0
          - AuthType: API_KEY
        ConnectionAuthModes:
          - AuthType: AWS_LAMBDA
        DefaultPublishAuthModes:
          - AuthType: API_KEY
        DefaultSubscribeAuthModes:
          - AuthType: AWS_LAMBDA
      Tags:
        - { Key: Application, Value: Cirkle }
        - { Key: Environment, Value: Production }

  EventApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt EventApi.ApiId
      Description: Server-only Cirkle delivery publisher

  ForumNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties: { ApiId: !GetAtt EventApi.ApiId, Name: forum }
  ThreadNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties: { ApiId: !GetAtt EventApi.ApiId, Name: thread }
  ChatNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties: { ApiId: !GetAtt EventApi.ApiId, Name: chat }
  TypingNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt EventApi.ApiId
      Name: typing
      PublishAuthModes: [{ AuthType: AWS_LAMBDA }]
  PresenceNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt EventApi.ApiId
      Name: presence
      PublishAuthModes: [{ AuthType: AWS_LAMBDA }]
  ChatTypingNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt EventApi.ApiId
      Name: chat-typing
      PublishAuthModes: [{ AuthType: AWS_LAMBDA }]
  ChatPresenceNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt EventApi.ApiId
      Name: chat-presence
      PublishAuthModes: [{ AuthType: AWS_LAMBDA }]

  RealtimePublisher:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cirkle-appsync-publisher
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 20
      MemorySize: 256
      Environment:
        Variables:
          APPSYNC_HTTP_DOMAIN: !GetAtt EventApi.Dns.Http
          APPSYNC_API_KEY: !GetAtt EventApiKey.ApiKey
          BRIDGE_SECRET: !Ref BridgeSecret
      Code:
        ZipFile: |
          const chunks = (items, size) => Array.from({ length: Math.ceil(items.length / size) }, (_, i) => items.slice(i * size, i * size + size));
          exports.handler = async event => {
            const supplied = event?.headers?.["x-cirkle-delivery-secret"] || event?.headers?.["X-Cirkle-Delivery-Secret"];
            if (!supplied || supplied !== process.env.BRIDGE_SECRET) return { statusCode: 401, body: JSON.stringify({ error: "Unauthorized" }) };
            const body = typeof event.body === "string" ? JSON.parse(event.body) : event.body || {};
            const deliveries = Array.isArray(body.deliveries) ? body.deliveries : [];
            const groups = new Map();
            for (const item of deliveries) groups.set(item.channel, [...(groups.get(item.channel) || []), item]);
            const succeeded = [], failed = [];
            for (const [channel, items] of groups) for (const batch of chunks(items, 5)) {
              try {
                const response = await fetch(`https://${process.env.APPSYNC_HTTP_DOMAIN}/event`, {
                  method: "POST",
                  headers: { "content-type": "application/json", "x-api-key": process.env.APPSYNC_API_KEY },
                  body: JSON.stringify({ channel, events: batch.map(item => JSON.stringify({ deliveryId: item.id, eventId: item.event_id, ...item.payload })) })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.message || `AppSync returned ${response.status}`);
                const rejected = new Map((result.failed || []).map(item => [item.index, item.message || "Rejected"]));
                batch.forEach((item, index) => rejected.has(index) ? failed.push({ id: item.id, error: rejected.get(index) }) : succeeded.push(item.id));
              } catch (error) {
                batch.forEach(item => failed.push({ id: item.id, error: error?.message || "Publish failed" }));
              }
            }
            return { statusCode: 200, headers: { "content-type": "application/json" }, body: JSON.stringify({ succeeded, failed }) };
          };

  PublisherUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt RealtimePublisher.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
  PublisherUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref RealtimePublisher
      Principal: "*"
      FunctionUrlAuthType: NONE
  PublisherInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RealtimePublisher
      Principal: "*"
      InvokedViaFunctionUrl: true

  PushDispatchTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cirkle-push-dispatch
      Tags:
        - { Key: Application, Value: Cirkle }

  AuthorizerLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/cirkle-appsync-authorizer, RetentionInDays: 14 }
  PublisherLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/cirkle-appsync-publisher, RetentionInDays: 14 }

Outputs:
  AppSyncApiId: { Value: !GetAtt EventApi.ApiId }
  AppSyncHttpEndpoint: { Value: !Sub "https://${EventApi.Dns.Http}/event" }
  AppSyncRealtimeEndpoint: { Value: !Sub "wss://${EventApi.Dns.Realtime}/event/realtime" }
  PublisherFunctionUrl: { Value: !GetAtt PublisherUrl.FunctionUrl }
  PushDispatchTopicArn: { Value: !Ref PushDispatchTopic }
