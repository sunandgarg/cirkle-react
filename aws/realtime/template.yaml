AWSTemplateFormatVersion: "2010-09-09"
Description: Cirkle AppSync Events transport for the Node and MySQL application.

Parameters:
  ApiBaseUrl:
    Type: String
    Default: https://api.cirkle.world
    AllowedPattern: ^https://[A-Za-z0-9.-]+$
    Description: Public HTTPS origin of the existing Cirkle Node API. No app is hosted by this stack.
  AuthorizerSharedSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Shared only by the AppSync Lambda authorizer and the Cirkle Node API.
  PublisherToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Server-only token used by the Cirkle Node API to publish AppSync events.

Resources:
  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - { Key: Application, Value: Cirkle }
        - { Key: Purpose, Value: AppSyncAuthorization }

  AuthorizerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RealtimeAuthorizer}"
      RetentionInDays: 14

  RealtimeAuthorizer:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt AuthorizerRole.Arn
      Timeout: 5
      MemorySize: 192
      Environment:
        Variables:
          CIRKLE_API_BASE_URL: !Ref ApiBaseUrl
          CIRKLE_AUTHORIZER_SECRET: !Ref AuthorizerSharedSecret
          CIRKLE_PUBLISHER_TOKEN: !Ref PublisherToken
      Code:
        ZipFile: |
          const crypto = require("node:crypto");
          const safeEqual = (left, right) => {
            const a = Buffer.from(String(left || ""));
            const b = Buffer.from(String(right || ""));
            return a.length > 0 && a.length === b.length && crypto.timingSafeEqual(a, b);
          };
          const unauthorized = () => ({ isAuthorized: false, ttlOverride: 0 });
          exports.handler = async event => {
            try {
              const rawToken = String(event.authorizationToken || "");
              const context = event.requestContext || {};
              const operation = String(context.operation || "");
              const channel = typeof context.channel === "string" ? context.channel : undefined;

              // Only the existing Node API may publish content-free durable
              // invalidations. Browsers never receive this credential.
              if (operation === "EVENT_PUBLISH") {
                return safeEqual(rawToken, process.env.CIRKLE_PUBLISHER_TOKEN)
                  ? { isAuthorized: true, ttlOverride: 0 }
                  : unauthorized();
              }
              if (operation !== "EVENT_CONNECT" && operation !== "EVENT_SUBSCRIBE") return unauthorized();
              if (operation === "EVENT_SUBSCRIBE" && !channel) return unauthorized();
              const token = rawToken.replace(/^Bearer\s+/i, "");
              if (!token) return unauthorized();
              const response = await fetch(`${process.env.CIRKLE_API_BASE_URL}/api/realtime/appsync/authorize`, {
                method: "POST",
                headers: {
                  authorization: `Bearer ${token}`,
                  "content-type": "application/json",
                  "x-cirkle-appsync-secret": process.env.CIRKLE_AUTHORIZER_SECRET,
                },
                body: JSON.stringify({ operation, ...(channel ? { channel } : {}) }),
                signal: AbortSignal.timeout(3500),
              });
              if (!response.ok) return unauthorized();
              const result = await response.json();
              if (result.allowed !== true || typeof result.user_id !== "string" || result.user_id.length > 100) return unauthorized();
              return {
                isAuthorized: true,
                handlerContext: { userId: result.user_id },
                // Membership, account status and JWT revocation are checked by
                // the Node API. Never cache those security decisions.
                ttlOverride: 0,
              };
            } catch (error) {
              console.error("AppSync authorization failed", error?.message || "unknown error");
              return unauthorized();
            }
          };

  AppSyncAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RealtimeAuthorizer
      Principal: appsync.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*"

  EventApi:
    Type: AWS::AppSync::Api
    DependsOn:
      - AppSyncAuthorizerPermission
      - AuthorizerLogs
    Properties:
      Name: cirkle-production-realtime
      OwnerContact: Cirkle.World
      EventConfig:
        AuthProviders:
          - AuthType: AWS_LAMBDA
            LambdaAuthorizerConfig:
              AuthorizerUri: !GetAtt RealtimeAuthorizer.Arn
              AuthorizerResultTtlInSeconds: 0
        ConnectionAuthModes:
          - AuthType: AWS_LAMBDA
        DefaultPublishAuthModes:
          - AuthType: AWS_LAMBDA
        DefaultSubscribeAuthModes:
          - AuthType: AWS_LAMBDA
      Tags:
        - { Key: Application, Value: Cirkle }
        - { Key: Environment, Value: Production }

  ForumNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties: { ApiId: !GetAtt EventApi.ApiId, Name: forum }
  ThreadNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties: { ApiId: !GetAtt EventApi.ApiId, Name: thread }
  ChatNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties: { ApiId: !GetAtt EventApi.ApiId, Name: chat }
  InboxNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties: { ApiId: !GetAtt EventApi.ApiId, Name: inbox }

Outputs:
  AppSyncApiId:
    Value: !GetAtt EventApi.ApiId
  AppSyncHttpEndpoint:
    Value: !Sub "https://${EventApi.Dns.Http}/event"
  AppSyncRealtimeEndpoint:
    Value: !Sub "wss://${EventApi.Dns.Realtime}/event/realtime"
  AuthorizerFunctionArn:
    Value: !GetAtt RealtimeAuthorizer.Arn
