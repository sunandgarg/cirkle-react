AWSTemplateFormatVersion: "2010-09-09"
Description: Private Cirkle media bucket with CloudFront OAC and signed private delivery.

Parameters:
  MediaSigningPublicKey:
    Type: String
    Description: PEM-encoded RSA public key. The private key remains only on the API host.
  BackupBucketName:
    Type: String
    Description: Existing private S3 bucket used only for database backups.
  EnableCloudFront:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create CloudFront delivery resources. Set false while an AWS account verification hold is active.

Conditions:
  UseCloudFront: !Equals [!Ref EnableCloudFront, "true"]

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
          - Id: RetainPreviousVersions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 90 }
      Tags:
        - { Key: App, Value: cirkle-react }
        - { Key: DataClass, Value: user-media }

  MediaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-s3-oac"
        Description: Signed CloudFront access to the private Cirkle media bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaPublicKey:
    Type: AWS::CloudFront::PublicKey
    Condition: UseCloudFront
    Properties:
      PublicKeyConfig:
        CallerReference: !Sub "${AWS::StackName}-20260905"
        Comment: Cirkle API media URL signing key
        EncodedKey: !Ref MediaSigningPublicKey
        Name: !Sub "${AWS::StackName}-signing-key"

  MediaKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Condition: UseCloudFront
    Properties:
      KeyGroupConfig:
        Comment: Trusted signers for private Cirkle media
        Items: [!Ref MediaPublicKey]
        Name: !Sub "${AWS::StackName}-trusted-signers"

  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Comment: Cirkle private and public user media
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: MediaS3Origin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !Ref MediaOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: MediaS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          TrustedKeyGroups: [!Ref MediaKeyGroup]
        CacheBehaviors:
          - { PathPattern: "avatars/*", TargetOriginId: MediaS3Origin, ViewerProtocolPolicy: redirect-to-https, AllowedMethods: [GET, HEAD, OPTIONS], CachedMethods: [GET, HEAD, OPTIONS], Compress: true, CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 }
          - { PathPattern: "nav-icons/*", TargetOriginId: MediaS3Origin, ViewerProtocolPolicy: redirect-to-https, AllowedMethods: [GET, HEAD, OPTIONS], CachedMethods: [GET, HEAD, OPTIONS], Compress: true, CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 }
          - { PathPattern: "institute-logos/*", TargetOriginId: MediaS3Origin, ViewerProtocolPolicy: redirect-to-https, AllowedMethods: [GET, HEAD, OPTIONS], CachedMethods: [GET, HEAD, OPTIONS], Compress: true, CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 }
          - { PathPattern: "entity-logos/*", TargetOriginId: MediaS3Origin, ViewerProtocolPolicy: redirect-to-https, AllowedMethods: [GET, HEAD, OPTIONS], CachedMethods: [GET, HEAD, OPTIONS], Compress: true, CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 }
        ViewerCertificate: { CloudFrontDefaultCertificate: true }
      Tags:
        - { Key: App, Value: cirkle-react }

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt MediaBucket.Arn, !Sub "${MediaBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - !If
            - UseCloudFront
            - Sid: AllowCloudFrontReadOnly
              Effect: Allow
              Principal: { Service: cloudfront.amazonaws.com }
              Action: s3:GetObject
              Resource: !Sub "${MediaBucket.Arn}/*"
              Condition:
                StringEquals:
                  "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}"
            - !Ref AWS::NoValue

  MediaAccessUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${AWS::StackName}-uploader"
      Policies:
        - PolicyName: MediaObjectAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt MediaBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${MediaBucket.Arn}/*"
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${BackupBucketName}/backups/mysql/*"

Outputs:
  MediaBucketName: { Value: !Ref MediaBucket }
  MediaDistributionId: { Condition: UseCloudFront, Value: !Ref MediaDistribution }
  MediaDistributionDomain: { Condition: UseCloudFront, Value: !GetAtt MediaDistribution.DomainName }
  MediaCloudFrontKeyPairId: { Condition: UseCloudFront, Value: !Ref MediaPublicKey }
  MediaAccessUserName: { Value: !Ref MediaAccessUser }
