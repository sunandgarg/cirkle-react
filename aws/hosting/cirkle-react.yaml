AWSTemplateFormatVersion: "2010-09-09"
Description: Budget Cirkle React AWS host with direct TLS, local encrypted MySQL, private S3, and no load balancer. AppSync is intentionally excluded.

Parameters:
  ExistingVpcId:
    Type: AWS::EC2::VPC::Id
  ExistingPublicSubnetA:
    Type: AWS::EC2::Subnet::Id
  ExistingPublicSubnetB:
    Type: AWS::EC2::Subnet::Id
  StaticPublicIp:
    Type: String
    Default: 15.252.62.154
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$"
  ApplicationDomain:
    Type: String
    Default: cirkle-react.cirkle.world
  InstanceType:
    Type: String
    Default: t4g.small

Resources:
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: cirkle-react }
        - { Key: App, Value: cirkle-react }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ExistingVpcId
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ExistingVpcId
      Tags:
        - { Key: Name, Value: cirkle-react-public }
        - { Key: App, Value: cirkle-react }

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ExistingPublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ExistingPublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AppDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
          - Id: RetainPreviousVersions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 90 }
          - Id: RetainDatabaseBackups
            Status: Enabled
            Prefix: backups/mysql/
            ExpirationInDays: 35
      Tags:
        - { Key: App, Value: cirkle-react }
        - { Key: DataClass, Value: user-content }

  DeploymentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDeployArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
      Tags:
        - { Key: App, Value: cirkle-react }
        - { Key: DataClass, Value: deployment-artifact }

  AppConfigSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: cirkle-react/application
      Description: Server-only Cirkle React application/provider configuration. Never expose in browser variables.
      SecretString: "{}"
      Tags:
        - { Key: App, Value: cirkle-react }

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Keep the original description because CloudFormation treats this field
      # as replacement-only; the ingress rules below define the new topology.
      GroupDescription: Cirkle React API traffic from its load balancer only
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: Public HTTP redirect and ACME }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: Public HTTPS }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: App, Value: cirkle-react }

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: CirkleReactRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource: [!GetAtt AppDataBucket.Arn, !Sub "${AppDataBucket.Arn}/*"]
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "${DeploymentBucket.Arn}/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppConfigSecret
      Tags:
        - { Key: App, Value: cirkle-react }

  ApiInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ApiRole]

  ApiInstance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ApiInstanceProfile
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}"
      SubnetId: !Ref ExistingPublicSubnetA
      SecurityGroupIds: [!Ref ApiSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y nginx jq tar gzip xz mariadb105 logrotate docker certbot python3-certbot-nginx
          curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v22.23.0/node-v22.23.0-linux-arm64.tar.xz
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          useradd --system --create-home --user-group --shell /bin/bash cirkle
          install -d -o root -g root -m 0755 /srv/cirkle
          install -d -o cirkle -g cirkle -m 0750 /srv/cirkle/releases /srv/cirkle/shared /srv/cirkle/shared/logs
          install -d -o root -g root -m 0755 /srv/cirkle/frontend
          cat >/etc/nginx/conf.d/cirkle-react.conf <<'NGINX'
          server {
            listen 80 default_server;
            server_name ${ApplicationDomain};
            root /srv/cirkle/frontend;
            index index.html;
            client_max_body_size 21m;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy 'camera=(self "https://*.daily.co"), microphone=(self "https://*.daily.co"), geolocation=(), payment=(), usb=()' always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-9R51Pm4w2hpUYj1jF3coUj15mQONvfoFo9Ptg5u3gqI='; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://*.daily.co wss://*.daily.co; frame-src 'self' https://*.daily.co; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
            location = /healthz { proxy_pass http://127.0.0.1:3001/healthz; }
            location = /readyz { deny all; }
            location = /api/readyz { deny all; }
            location /api/ {
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 120s;
              proxy_pass http://127.0.0.1:3001;
            }
            location /socket.io/ {
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 3600s;
              proxy_pass http://127.0.0.1:3001;
            }
            location ~* ^/assets/ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
            location = /sw.js { add_header Cache-Control "no-store"; try_files $uri =404; }
            location / { add_header Cache-Control "no-store"; try_files $uri $uri/ /index.html; }
          }
          NGINX
          rm -f /etc/nginx/conf.d/default.conf
          nginx -t
          systemctl enable --now nginx
          systemctl enable --now docker
          cat >/etc/logrotate.d/cirkle-react <<'ROTATE'
          /srv/cirkle/shared/logs/*.log {
            daily
            maxsize 25M
            rotate 14
            compress
            delaycompress
            missingok
            notifempty
            copytruncate
          }
          ROTATE
      Tags:
        - { Key: Name, Value: cirkle-react-api }
        - { Key: App, Value: cirkle-react }

Outputs:
  ApplicationUrl: { Value: !Sub "https://${ApplicationDomain}" }
  StaticPublicIp: { Value: !Ref StaticPublicIp }
  DeploymentBucketName: { Value: !Ref DeploymentBucket }
  AppDataBucketName: { Value: !Ref AppDataBucket }
  ApiInstanceId: { Value: !Ref ApiInstance }
  AppConfigSecretArn: { Value: !Ref AppConfigSecret }
