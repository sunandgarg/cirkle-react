AWSTemplateFormatVersion: "2010-09-09"
Description: Cirkle AWS hosting (ALB, S3, EC2, RDS MySQL, IAM and Secrets Manager). AppSync is intentionally excluded.

Parameters:
  EnvironmentName:
    Type: String
    Default: staging
    AllowedPattern: "[a-z0-9-]+"
  InstanceType:
    Type: String
    Default: t4g.small
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
  ApplicationDomain:
    Type: String
    Default: staging.cirkle.world
  CertificateArn:
    Type: String
    Description: ap-south-1 ACM certificate ARN for ApplicationDomain

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "cirkle-${EnvironmentName}" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: { RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  AppDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
          - Id: RetainPreviousVersions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 90 }
      Tags: [{ Key: App, Value: cirkle }]

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MySQL only from the Cirkle API host
      VpcId: !Ref Vpc
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API traffic only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS entry point for Cirkle
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, DestinationSecurityGroupId: !Ref ApiSecurityGroup }
  ApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref ApiSecurityGroup, IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup }
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref DatabaseSecurityGroup, IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !Ref ApiSecurityGroup }

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Cirkle database subnets
      SubnetIds: [!Ref PublicSubnetA, !Ref PublicSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      DBName: cirkle
      MasterUsername: cirkle_admin
      ManageMasterUserPassword: true
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      # The new AWS India account is currently on the free plan, which caps
      # automated RDS retention at one day. Raise this to 7+ before production.
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      DeletionProtection: true
      MultiAZ: false
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      Tags: [{ Key: App, Value: cirkle }]

  AppConfigSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: Server-only Cirkle provider and application configuration. Never expose in Vite variables.
      SecretString: "{}"

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: CirkleRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource: [!GetAtt AppDataBucket.Arn, !Sub "${AppDataBucket.Arn}/*"]
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref AppConfigSecret, !GetAtt Database.MasterUserSecret.SecretArn]
  ApiInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref ApiRole] }
  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ApiInstanceProfile
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}"
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds: [!Ref ApiSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y nginx jq tar gzip mariadb105
          curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v22.23.0/node-v22.23.0-linux-arm64.tar.xz
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          npm install -g pm2@7
          useradd --system --create-home --user-group --shell /bin/bash cirkle
          install -d -o cirkle -g cirkle -m 0750 /srv/cirkle/releases /srv/cirkle/shared /srv/cirkle/shared/logs /srv/cirkle/frontend
          cat >/etc/nginx/conf.d/cirkle.conf <<'NGINX'
          server {
            listen 80 default_server;
            server_name ${ApplicationDomain};
            root /srv/cirkle/frontend;
            client_max_body_size 21m;
            location = /healthz { proxy_pass http://127.0.0.1:3001/healthz; }
            location = /readyz { deny all; }
            location /api/ { proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $http_x_forwarded_for; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 120s; proxy_pass http://127.0.0.1:3001; }
            location /socket.io/ { proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $http_x_forwarded_for; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; proxy_pass http://127.0.0.1:3001; }
            location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          rm -f /etc/nginx/conf.d/default.conf
          systemctl enable --now nginx
      Tags: [{ Key: Name, Value: !Sub "cirkle-${EnvironmentName}-api" }]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 80
      Protocol: HTTP
      TargetType: instance
      Targets: [{ Id: !Ref ApiInstance, Port: 80 }]
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
  LoadBalancerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]
  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

Outputs:
  ApplicationUrl: { Value: !Sub "https://${ApplicationDomain}" }
  LoadBalancerDnsName: { Value: !GetAtt LoadBalancer.DNSName }
  FrontendBucketName: { Value: !Ref FrontendBucket }
  ArtifactBucketName: { Value: !Ref ArtifactBucket }
  AppDataBucketName: { Value: !Ref AppDataBucket }
  ApiInstanceId: { Value: !Ref ApiInstance }
  DatabaseEndpoint: { Value: !GetAtt Database.Endpoint.Address }
  DatabasePort: { Value: !GetAtt Database.Endpoint.Port }
  DatabaseSecretArn: { Value: !GetAtt Database.MasterUserSecret.SecretArn }
  AppConfigSecretArn: { Value: !Ref AppConfigSecret }
