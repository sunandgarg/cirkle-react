<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Cirkle - Invite-only community-specific networking</title>
    <link rel="icon" type="image/png" href="/cirkle-logo.png">
    <link rel="apple-touch-icon" href="/cirkle-logo.png" />
    <meta name="description" content="Cirkle is the private networking platform for verified communities: focused forums, trusted connections, relevant opportunities, events and expert access.">
    <meta name="author" content="Cirkle" />
    <meta name="keywords" content="private community platform, invite-only network, community networking, alumni network, professional community, verified community, community forum" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://cirkle.world" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cirkle - Find the network you actually belong in" />
    <meta property="og:description" content="Invite-only, community-specific networking built around shared context - not public follower counts." />
    <meta property="og:url" content="https://cirkle.world" />
    <meta property="og:site_name" content="Cirkle" />
    <meta property="og:image" content="https://cirkle.world/cirkle-logo.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cirkle - Find the network you actually belong in" />
    <meta name="twitter:description" content="Invite-only, community-specific networking built around shared context - not public follower counts." />
    <meta name="twitter:image" content="https://cirkle.world/cirkle-logo.png" />

    <!-- GEO -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <link rel="alternate" hreflang="en-in" href="https://cirkle.world" />
    <link rel="alternate" hreflang="x-default" href="https://cirkle.world" />

    <!-- Theme -->
    <meta id="theme-color" name="theme-color" content="#f5f7f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark light" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Cirkle",
      "description": "Cirkle is an invite-only, community-specific networking platform for focused forums, trusted connections, opportunities, events and expert access.",
      "url": "https://cirkle.world",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cirkle.world/search?q={query}",
        "query-input": "required name=query"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
