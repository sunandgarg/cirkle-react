<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, interactive-widget=resizes-content" />
    <title>Cirkle - IIT Community Forum, Jobs, Consult & Events</title>
    <link rel="icon" type="image/png" href="/cirkle-logo.png">
    <link rel="apple-touch-icon" href="/cirkle-logo.png" />
    <meta name="description" content="Cirkle is the verified IIT community platform. Join 23 IIT forums for campus discussions, placements, jobs, mentorship and alumni networking. Email-verified members only.">
    <meta name="author" content="Cirkle" />
    <meta name="keywords" content="IIT community, IIT Bombay, IIT Delhi, IIT Madras, IIT forum, IIT placements, IIT jobs, IIT alumni, professional networking, consultation, mentorship, campus life" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://tribe-link-network.lovable.app" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cirkle - IIT Community Forum, Jobs & Consult" />
    <meta property="og:description" content="The verified IIT community. 23 IIT forums, placement discussions, job referrals, expert consultations and alumni networking - all in one platform." />
    <meta property="og:url" content="https://tribe-link-network.lovable.app" />
    <meta property="og:site_name" content="Cirkle" />
    <meta property="og:image" content="https://tribe-link-network.lovable.app/cirkle-logo.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cirkle - IIT Community Forum, Jobs & Consult" />
    <meta name="twitter:description" content="The verified IIT community. 23 IIT forums, placement discussions, job referrals, expert consultations and alumni networking." />
    <meta name="twitter:image" content="https://tribe-link-network.lovable.app/cirkle-logo.png" />

    <!-- GEO -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <link rel="alternate" hreflang="en-in" href="https://tribe-link-network.lovable.app" />
    <link rel="alternate" hreflang="x-default" href="https://tribe-link-network.lovable.app" />

    <!-- Theme -->
    <meta name="theme-color" content="#0a0f1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark light" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Cirkle",
      "description": "Cirkle is the verified IIT community platform connecting students and alumni across all 23 Indian Institutes of Technology. Discussions, placements, jobs, mentorship and events.",
      "url": "https://tribe-link-network.lovable.app",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://tribe-link-network.lovable.app/search?q={query}",
        "query-input": "required name=query"
      }
    }
    </script>
  </head>
  <body class="light">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
