[auth]
site_url = "https://cirkle.world"
additional_redirect_urls = [
  "https://cirkle.world/iit-verify",
  "https://cirkle.world/reset-password",
  "https://www.cirkle.world/iit-verify",
  "https://www.cirkle.world/reset-password",
]

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.request-login-otp]
verify_jwt = false

[functions.verify-login-otp]
verify_jwt = false

[functions.send-verification-email]
verify_jwt = true

[functions.verify-iit-email]
verify_jwt = true

[functions.notify-verification-decision]
verify_jwt = true

[functions.seed-data]
verify_jwt = true

[functions.scan-events]
verify_jwt = true

[functions.scan-jobs]
verify_jwt = true
