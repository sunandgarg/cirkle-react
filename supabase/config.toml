[auth]
site_url = "https://cirkle.world"
additional_redirect_urls = [
  "https://cirkle.world/iit-verify",
  "https://cirkle.world/reset-password",
  "https://www.cirkle.world/iit-verify",
  "https://www.cirkle.world/reset-password",
]

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.email.template.recovery]
subject = "Reset your Cirkle.World password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Verify your Cirkle.World email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your secure Cirkle.World sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.invite]
subject = "You’re invited to Cirkle.World"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new Cirkle.World email"
content_path = "./supabase/templates/email-change.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.request-login-otp]
verify_jwt = false

[functions.verify-login-otp]
verify_jwt = false

[functions.request-password-reset]
verify_jwt = false

[functions.send-verification-email]
verify_jwt = true

[functions.verify-iit-email]
verify_jwt = true

[functions.notify-verification-decision]
verify_jwt = true

[functions.seed-data]
verify_jwt = true

[functions.manage-users]
verify_jwt = true

[functions.scan-events]
verify_jwt = true

[functions.scan-jobs]
verify_jwt = true

[functions.klipy-search]
verify_jwt = true

[functions.daily-create-room]
verify_jwt = true

[functions.create-consult-chat]
verify_jwt = true
