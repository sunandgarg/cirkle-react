map $http_upgrade $cirkle_connection_upgrade {
    default upgrade;
    ''      close;
}

# Never persist query strings: OAuth callbacks and signed media URLs carry
# short-lived bearer material in their query parameters.
log_format cirkle_safe '$remote_addr [$time_local] '
                       '"$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent request_id=$request_id '
                       'request_time=$request_time upstream_time=$upstream_response_time';

upstream cirkle_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.cirkle.world;
    access_log /var/log/nginx/cirkle-api.access.log cirkle_safe;
    # Upstream error messages can include a full request line. Keep Nginx at
    # critical-only and use the query-scrubbing Node logger for API diagnosis.
    error_log /var/log/nginx/cirkle-api.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://api.cirkle.world$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.cirkle.world;

    ssl_certificate /etc/cirkle/tls/fullchain.pem;
    ssl_certificate_key /etc/cirkle/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CIRKLE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 21m;
    client_body_timeout 30s;
    keepalive_timeout 65s;

    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/cirkle-api.access.log cirkle_safe;
    error_log /var/log/nginx/cirkle-api.error.log crit;

    location = /healthz {
        access_log off;
        proxy_pass http://cirkle_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /readyz {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://cirkle_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location ^~ /api/socket.io {
        proxy_pass http://cirkle_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cirkle_connection_upgrade;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    location ^~ /api/ {
        proxy_pass http://cirkle_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # CORS is intentionally not duplicated here. The Node API validates the
    # exact credentialed-origin allowlist in CORS_ORIGINS.
    location / {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"API route not found"}}';
    }
}
